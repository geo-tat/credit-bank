version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: credit-db
    environment:
      POSTGRES_DB: credit-db
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data


volumes:
  postgres_data: